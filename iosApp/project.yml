name: iosApp
options:
  bundleIdPrefix: com.Guide.suchelin
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        type: group
      - path: GoogleService-Info.plist
        type: file
        buildPhase: resources
    info:
      path: iosApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Guide.suchelin.ios
        INFOPLIST_FILE: iosApp/Info.plist
        PRODUCT_NAME: iosApp
        SWIFT_VERSION: "5.9"
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LINKER_FLAGS:
          - "$(inherited)"
          - "-framework"
          - "shared"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseCore
      - package: firebase-ios-sdk
        product: FirebaseFirestore
      - package: firebase-ios-sdk
        product: FirebaseDatabase
      - package: firebase-ios-sdk
        product: FirebaseAnalytics
    preBuildScripts:
      - name: "Compile Kotlin Framework"
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        inputFiles: []
        outputFiles: []
        basedOnDependencyAnalysis: false
    scheme:
      testTargets: []
      commandLineArguments: {}

packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    version: "11.6.0"
